name: Clear stale Pages deployment

on:
  push:
    branches: [work]
    paths:
      - .github/workflows/clear-stale-pages.yml

permissions:
  contents: read
  pages: write

jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale Pages deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          STALE_DEPLOYMENT: 5ab4919c73371b6df8311b0e4a9c2e27578d797f
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${REPOSITORY}/pages/deployments/${STALE_DEPLOYMENT}"
          headers=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          status_code="$(curl -sS -L -o /tmp/pages-deployment.json -w '%{http_code}' "${headers[@]}" "${api}")"
          if [[ "${status_code}" == "404" ]]; then
            echo "No stale Pages deployment exists for ${STALE_DEPLOYMENT}."
            exit 0
          fi
          if [[ "${status_code}" != "200" ]]; then
            cat /tmp/pages-deployment.json
            echo "Unexpected status while reading Pages deployment: ${status_code}" >&2
            exit 1
          fi

          deployment_status="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; const data = JSON.parse(readFileSync("/tmp/pages-deployment.json", "utf8")); process.stdout.write(String(data.status ?? "unknown"));')"
          echo "Stale Pages deployment status: ${deployment_status}"

          case "${deployment_status}" in
            succeed|success|cancelled|canceled|error|failure)
              echo "The deployment is already terminal; no cancellation is required."
              exit 0
              ;;
          esac

          cancel_code="$(curl -sS -L -X POST -o /tmp/pages-cancel.json -w '%{http_code}' "${headers[@]}" "${api}/cancel")"
          if [[ "${cancel_code}" != "204" && "${cancel_code}" != "404" ]]; then
            cat /tmp/pages-cancel.json
            echo "Unable to cancel stale Pages deployment: ${cancel_code}" >&2
            exit 1
          fi

          for attempt in {1..12}; do
            check_code="$(curl -sS -L -o /tmp/pages-check.json -w '%{http_code}' "${headers[@]}" "${api}")"
            if [[ "${check_code}" == "404" ]]; then
              echo "Stale Pages deployment no longer exists."
              exit 0
            fi
            if [[ "${check_code}" != "200" ]]; then
              cat /tmp/pages-check.json
              echo "Unexpected status while confirming cancellation: ${check_code}" >&2
              exit 1
            fi

            current_status="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; const data = JSON.parse(readFileSync("/tmp/pages-check.json", "utf8")); process.stdout.write(String(data.status ?? "unknown"));')"
            echo "Cancellation check ${attempt}: ${current_status}"
            case "${current_status}" in
              cancelled|canceled|error|failure)
                exit 0
                ;;
            esac
            sleep 5
          done

          echo "Stale Pages deployment did not reach a terminal state after cancellation." >&2
          exit 1
