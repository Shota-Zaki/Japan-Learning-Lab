name: Build and deploy GitHub Pages

on:
  push:
    branches: [work]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify FE implementation
        run: npm run verify:fe

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Upload generated repository output
        if: github.ref == 'refs/heads/work' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: generated-pages-source
          path: |
            docs
            prototype/public/data/fe-official-past-questions.json
          include-hidden-files: true
          retention-days: 1

  deploy:
    if: github.ref == 'refs/heads/work' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public Pages resources and revision
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          const delay = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));

          async function fetchWithRetry(url, attempts = 12) {
            let lastError;
            for (let attempt = 1; attempt <= attempts; attempt += 1) {
              try {
                const response = await fetch(url, { redirect: "follow", cache: "no-store" });
                if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
                return response;
              } catch (error) {
                lastError = error;
                if (attempt < attempts) await delay(5000);
              }
            }
            throw new Error(`Unable to fetch ${url}: ${lastError?.message || lastError}`);
          }

          const pageUrl = new URL(process.env.PAGE_URL);
          const indexResponse = await fetchWithRetry(pageUrl);
          const html = await indexResponse.text();
          if (!html.includes("Japan Learning Lab")) {
            throw new Error("Published index does not contain the expected application title");
          }

          const buildInfoUrl = new URL("build-info.json", pageUrl);
          const buildInfoResponse = await fetchWithRetry(buildInfoUrl);
          const buildInfo = await buildInfoResponse.json();
          if (buildInfo.sourceRevision !== process.env.SOURCE_SHA) {
            throw new Error(`Published source revision mismatch: expected ${process.env.SOURCE_SHA}, received ${buildInfo.sourceRevision}`);
          }

          const dataUrl = new URL("data/fe-official-past-questions.json", pageUrl);
          const dataResponse = await fetchWithRetry(dataUrl);
          const data = await dataResponse.json();
          const expectedFigures = new Map([
            ["fe-ipa-2022sample-a-005", "assets/fe/a-2022-005-figure.svg"],
            ["fe-ipa-2022sample-a-006", "assets/fe/a-2022-006-figure.svg"],
            ["fe-ipa-2022sample-a-007", "assets/fe/a-2022-007-figure.svg"],
          ]);

          const resourceUrls = new Set([
            buildInfoUrl.href,
            dataUrl.href,
            new URL("favicon.svg", pageUrl).href,
          ]);
          for (const [questionId, expectedSource] of expectedFigures) {
            const question = data.questions?.find((item) => item.id === questionId);
            const images = [
              ...(question?.questionBlocks || []),
              ...(question?.choices || []).flatMap((choice) => choice.contentBlocks || []),
            ].filter((block) => block?.type === "image" && block.src);
            if (!images.some((image) => image.src === expectedSource)) {
              throw new Error(`Published ${questionId} does not reference ${expectedSource}`);
            }
            resourceUrls.add(new URL(expectedSource, pageUrl).href);
          }

          for (const match of html.matchAll(/(?:src|href)="([^"]+)"/g)) {
            const resourceUrl = new URL(match[1], pageUrl);
            if (resourceUrl.origin === pageUrl.origin && resourceUrl.pathname.startsWith(pageUrl.pathname)) {
              resourceUrls.add(resourceUrl.href);
            }
          }

          for (const resourceUrl of resourceUrls) {
            const response = await fetchWithRetry(resourceUrl);
            const length = Number(response.headers.get("content-length") || 0);
            if (length === 0) {
              const bytes = new Uint8Array(await response.arrayBuffer());
              if (bytes.length === 0) throw new Error(`Published resource is empty: ${resourceUrl}`);
            }
            console.log(`Verified ${resourceUrl}`);
          }
          console.log(`Public Pages smoke check passed for ${pageUrl.href} at ${process.env.SOURCE_SHA} with ${resourceUrls.size} resources`);
          NODE

      - name: Checkout work for generated output and evidence
        uses: actions/checkout@v4
        with:
          ref: work

      - name: Fast-forward work before evidence update
        run: git pull --ff-only origin work

      - name: Download generated repository output
        uses: actions/download-artifact@v4
        with:
          name: generated-pages-source
          path: .

      - name: Record successful Pages deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { mkdir, readFile, writeFile } from "node:fs/promises";

          const buildInfo = JSON.parse(await readFile("docs/build-info.json", "utf8"));
          if (buildInfo.sourceRevision !== process.env.SOURCE_SHA) {
            throw new Error(`Generated build-info revision mismatch: expected ${process.env.SOURCE_SHA}, received ${buildInfo.sourceRevision}`);
          }

          const html = await readFile("docs/index.html", "utf8");
          const script = html.match(/<script[^>]+src="([^"]+)"/)?.[1] ?? null;
          const stylesheet = html.match(/<link[^>]+rel="stylesheet"[^>]+href="([^"]+)"/)?.[1]
            ?? html.match(/<link[^>]+href="([^"]+)"[^>]+rel="stylesheet"/)?.[1]
            ?? null;
          if (!script || !stylesheet) throw new Error("Generated index asset references could not be identified");

          await mkdir("prototype/qa", { recursive: true });
          await writeFile("prototype/qa/pages-deployment.json", `${JSON.stringify({
            status: "success",
            publicSmokeCheck: "success",
            pageUrl: process.env.PAGE_URL,
            sourceBranch: process.env.SOURCE_BRANCH,
            sourceRevision: process.env.SOURCE_SHA,
            publicBuildInfoSourceRevision: process.env.SOURCE_SHA,
            repositoryBuildInfoSourceRevision: buildInfo.sourceRevision,
            publishedAssets: {
              script,
              stylesheet,
            },
            checks: {
              index: "success",
              buildInfo: "success",
              generatedAssets: "success",
              questionData: "success",
              sampleFigures: "success",
            },
            workflowRunId: Number(process.env.RUN_ID),
            workflowRunNumber: Number(process.env.RUN_NUMBER),
            workflowRunUrl: `https://github.com/${process.env.REPOSITORY}/actions/runs/${process.env.RUN_ID}`,
          }, null, 2)}\n`, "utf8");
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs prototype/public/data/fe-official-past-questions.json prototype/qa/pages-deployment.json
          git commit -m "docs: sync successful Pages deployment evidence [skip ci]"
          git push origin HEAD:work
