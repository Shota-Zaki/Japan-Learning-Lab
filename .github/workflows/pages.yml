name: One-shot repository docs synchronization

on:
  push:
    branches: [work]

permissions:
  contents: write

concurrency:
  group: docs-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - name: Install dependencies
        working-directory: prototype
        run: npm ci
      - name: Run required verification
        working-directory: prototype
        run: |
          npm test
          npm run typecheck
          npm run lint
          npm run build
          npm run audit:fe-filter-layouts
      - name: Build fixed Pages output twice
        working-directory: prototype
        env:
          FIXED_APPLICATION_SHA: 66a03576b5b9ac2c86c35c63045f923137f08a0c
        run: |
          set -euo pipefail
          GITHUB_SHA="$FIXED_APPLICATION_SHA" npm run build:pages
          test "$(node -p "require('../docs/build-info.json').sourceRevision")" = "$FIXED_APPLICATION_SHA"
          rm -rf /tmp/pages-first
          cp -a ../docs /tmp/pages-first
          GITHUB_SHA="$FIXED_APPLICATION_SHA" npm run build:pages
          diff -qr /tmp/pages-first ../docs
      - name: Commit generated docs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          git diff --cached --quiet && exit 0
          git commit -m "docs: synchronize fixed FE Pages output [skip ci]"
          git push origin HEAD:work
