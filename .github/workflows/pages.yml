name: Build and deploy GitHub Pages

on:
  push:
    branches: [work]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify FE implementation
        run: npm run verify:fe

      - name: Commit Pages output to work
        if: github.ref == 'refs/heads/work' && github.event_name == 'push'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs
          if git diff --cached --quiet; then
            echo "docs output is already current"
          else
            git commit -m "build: update GitHub Pages output [skip ci]"
            git push origin HEAD:work
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    if: github.ref == 'refs/heads/work' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public Pages resources
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'NODE'
          const delay = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));

          async function fetchWithRetry(url, attempts = 12) {
            let lastError;
            for (let attempt = 1; attempt <= attempts; attempt += 1) {
              try {
                const response = await fetch(url, { redirect: "follow", cache: "no-store" });
                if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
                return response;
              } catch (error) {
                lastError = error;
                if (attempt < attempts) await delay(5000);
              }
            }
            throw new Error(`Unable to fetch ${url}: ${lastError?.message || lastError}`);
          }

          const pageUrl = new URL(process.env.PAGE_URL);
          const indexResponse = await fetchWithRetry(pageUrl);
          const html = await indexResponse.text();
          if (!html.includes("Japan Learning Lab")) throw new Error("Published index does not contain the expected application title");

          const resourceUrls = new Set([
            new URL("data/fe-official-past-questions.json", pageUrl).href,
            new URL("favicon.svg", pageUrl).href,
          ]);
          for (const match of html.matchAll(/(?:src|href)="([^"]+)"/g)) {
            const resourceUrl = new URL(match[1], pageUrl);
            if (resourceUrl.origin === pageUrl.origin && resourceUrl.pathname.startsWith(pageUrl.pathname)) resourceUrls.add(resourceUrl.href);
          }

          for (const resourceUrl of resourceUrls) {
            const response = await fetchWithRetry(resourceUrl);
            const length = Number(response.headers.get("content-length") || 0);
            if (length === 0) {
              const bytes = new Uint8Array(await response.arrayBuffer());
              if (bytes.length === 0) throw new Error(`Published resource is empty: ${resourceUrl}`);
            }
            console.log(`Verified ${resourceUrl}`);
          }
          console.log(`Public Pages smoke check passed for ${pageUrl.href} with ${resourceUrls.size} resources`);
          NODE

      - name: Checkout work for deployment evidence
        uses: actions/checkout@v4
        with:
          ref: work

      - name: Record successful Pages deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          import { mkdir, writeFile } from "node:fs/promises";
          await mkdir("prototype/qa", { recursive: true });
          await writeFile("prototype/qa/pages-deployment.json", `${JSON.stringify({
            status: "success",
            publicSmokeCheck: "success",
            pageUrl: process.env.PAGE_URL,
            sourceRevision: process.env.SOURCE_SHA,
            workflowRunId: Number(process.env.RUN_ID),
            workflowRunNumber: Number(process.env.RUN_NUMBER),
            workflowRunUrl: `https://github.com/${process.env.REPOSITORY}/actions/runs/${process.env.RUN_ID}`,
          }, null, 2)}\n`, "utf8");
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototype/qa/pages-deployment.json
          git commit -m "docs: record successful Pages deployment [skip ci]"
          git push origin HEAD:work
