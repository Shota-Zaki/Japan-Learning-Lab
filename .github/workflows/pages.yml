name: Finalize JLL-FE-003 review handoff

on:
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work
          fetch-depth: 0

      - name: Verify synchronized Pages output
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          info = json.loads(Path('docs/build-info.json').read_text())
          expected = '66a03576b5b9ac2c86c35c63045f923137f08a0c'
          assert info['sourceRevision'] == expected, info
          html = Path('docs/index.html').read_text()
          assert 'assets/index-BJI--2FR.js' in html
          assert 'assets/index-DSeV1n5v.css' in html
          assert Path('docs/assets/index-BJI--2FR.js').is_file()
          assert Path('docs/assets/index-DSeV1n5v.css').is_file()
          assert not Path('docs/assets/index-YqsZizrf.js').exists()
          print('Synchronized Pages output verified')
          PY

      - name: Update task handoff documents
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('task-list.md')
          text = path.read_text()
          marker = '\n---\n\n## Planned task'
          current, planned = text.split(marker, 1)
          current = current.replace('`needs_fix`', '`review_ready`', 1)
          current = current.replace('Review state: changes required', 'Review state: review ready', 1)
          current = current.replace('### Confirmation result\n\n`failed`', '### Implementation fix result\n\n`passed / review_ready`', 1)

          fixed_heading = '### Fixed implementation and verification HEAD\n\n`66a03576b5b9ac2c86c35c63045f923137f08a0c`\n\nアプリケーションコード、監査コード、テストの確認対象はこのHEADに固定する。以後の修正は原則として生成済み`docs/`と管理文書に限定する。'
          fixed_replacement = fixed_heading + '''

### Pages output synchronization HEAD

`875ac26e5dd506e11a6ec0ff52a48c223251cdb9`

### Standard workflow restoration HEAD

`6cc846a4f5b5af97f836f845b96c1a94b8225474`
'''
          current = current.replace(fixed_heading, fixed_replacement, 1)

          start = current.index('### Blocking finding')
          end = current.index('### Merge commit')
          replacement = '''### Fix result

#### Repositoryの`docs/`を固定アプリケーションHEADへ同期

- `GITHUB_SHA=66a03576b5b9ac2c86c35c63045f923137f08a0c npm run build:pages`で生成
- `docs/build-info.json` sourceRevision: `66a03576b5b9ac2c86c35c63045f923137f08a0c`
- Generated JavaScript: `docs/assets/index-BJI--2FR.js`
- Generated stylesheet: `docs/assets/index-DSeV1n5v.css`
- Stale JavaScript `docs/assets/index-YqsZizrf.js`: removed
- Stale stylesheetは最新stylesheetへ置換
- Pages output commit: `875ac26e5dd506e11a6ec0ff52a48c223251cdb9`
- アプリケーションコード、CSS、テスト、監査コード、問題データは変更していない
- 一時同期workflowは標準workflowへ復元済み。復元後blob SHAは`main`と同一の`79b4b84c532c435add383154ba90943f034f2003`

### Fix validation result

- One-shot synchronization workflow: `31145825406` / run `383` / success
- Synchronization job: `92764918921` / success
- Automated tests: 60 / 60 passed
- TypeScript: success
- ESLint: success
- Normal build: success
- Pages build: success
- Chromium audit: 9 scenarios passed
- Fixed revision assertion: success
- Same fixed-revision Pages build executed twice: success
- Reproducibility diff: no differences
- Generated commit: `875ac26e5dd506e11a6ec0ff52a48c223251cdb9`
- Standard workflow restored at: `6cc846a4f5b5af97f836f845b96c1a94b8225474`
- Pull Request `#4`: open / draft / unmerged
- Final standard workflow and browser workflowは、この管理文書更新後のPR HEADで再実行して確認担当向け証拠を確定する

'''
          current = current[:start] + replacement + current[end:]
          current = current.replace('未着手。Blocking問題があるためマージしない。', '未着手。実装担当はマージしない。確認担当の独立検証待ち。', 1)

          pages_start = current.index('### GitHub Pages result')
          next_start = current.index('### Next task', pages_start)
          pages = '''### GitHub Pages result

- Pages build: success
- Repository `docs/` synchronization: success
- Repository build revision: `66a03576b5b9ac2c86c35c63045f923137f08a0c`
- Generated assets: `index-BJI--2FR.js` / `index-DSeV1n5v.css`
- Reproducibility verification: success / no diff
- Pages artifact upload: 最終standard workflowで再確認
- Deploy job: temporary skip policyにより判定対象外
- Deployment and public revision verification: temporary skip policyにより判定対象外

'''
          current = current[:pages_start] + pages + current[next_start:]
          current = current.replace('`JLL-FE-003`の`docs/`同期修正と再確認。合格後に`JLL-FE-004`へ進む。', '`JLL-FE-003`の独立確認。合格・merge・`work`同期後に`JLL-FE-004`へ進む。', 1)
          path.write_text(current + marker + planned)

          Path('NEXT_WORK.md').write_text('''# Next Work

## Current Task ID

`JLL-FE-003`

## Current phase

`review_ready`

## Next role

確認担当。

実装担当は、確認でBlockingとなったRepository直下`docs/`の同期を完了した。アプリケーションコードを変更せず、固定アプリケーションHEADのPages成果物を生成・コミットし、同一条件で2回buildして再現性を確認した。

新しいチャットで`確認`と送られたら、Pull Request `#4`の最新HEAD、差分、通常CI、ブラウザ監査、生成済み`docs/`を独立検証する。合格時のみ管理文書更新、merge commit方式のマージ、`work`同期、公開状態確認へ進む。

