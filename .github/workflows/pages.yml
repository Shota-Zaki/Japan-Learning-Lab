name: Finalize JLL-FE-003 review handoff

on:
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work
          fetch-depth: 0

      - name: Verify synchronized Pages output
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          info = json.loads(Path('docs/build-info.json').read_text())
          assert info['sourceRevision'] == '66a03576b5b9ac2c86c35c63045f923137f08a0c'
          html = Path('docs/index.html').read_text()
          assert 'assets/index-BJI--2FR.js' in html
          assert 'assets/index-DSeV1n5v.css' in html
          assert Path('docs/assets/index-BJI--2FR.js').is_file()
          assert Path('docs/assets/index-DSeV1n5v.css').is_file()
          assert not Path('docs/assets/index-YqsZizrf.js').exists()
          PY

      - name: Update task list
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          fixed = base64.b64decode('').decode()
          result = base64.b64decode('').decode()
          pages = base64.b64decode('').decode()
          path = Path('task-list.md')
          text = path.read_text()
          marker = '\n---\n\n## Planned task'
          current, planned = text.split(marker, 1)
          current = current.replace('`needs_fix`', '`review_ready`', 1)
          current = current.replace('Review state: changes required', 'Review state: review ready', 1)
          current = current.replace('### Confirmation result\n\n`failed`', '### Implementation fix result\n\n`passed / review_ready`', 1)
          old_fixed = '### Fixed implementation and verification HEAD\n\n`66a03576b5b9ac2c86c35c63045f923137f08a0c`\n\nアプリケーションコード、監査コード、テストの確認対象はこのHEADに固定する。以後の修正は原則として生成済み`docs/`と管理文書に限定する。\n'
          current = current.replace(old_fixed, fixed, 1)
          start = current.index('### Blocking finding')
          end = current.index('### Merge commit')
          current = current[:start] + result + current[end:]
          current = current.replace('未着手。Blocking問題があるためマージしない。', '未着手。実装担当はマージしない。確認担当の独立検証待ち。', 1)
          pages_start = current.index('### GitHub Pages result')
          next_start = current.index('### Next task', pages_start)
          current = current[:pages_start] + pages + current[next_start:]
          current = current.replace('`JLL-FE-003`の`docs/`同期修正と再確認。合格後に`JLL-FE-004`へ進む。', '`JLL-FE-003`の独立確認。合格・merge・`work`同期後に`JLL-FE-004`へ進む。', 1)
          path.write_text(current + marker + planned)
          PY

      - name: Restore standard workflow and commit
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.github/workflows/pages.yml > .github/workflows/pages.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add task-list.md .github/workflows/pages.yml
          git diff --cached --quiet && exit 0
          git commit -m "docs: mark JLL-FE-003 review ready [skip ci]"
          git push origin HEAD:work
