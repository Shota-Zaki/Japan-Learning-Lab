name: Temporary JLL-FE-003 order fix

on:
  push:
    branches: [work]
    paths:
      - .github/jll-fe-003-order-fix.trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work
          fetch-depth: 0
      - name: Apply scoped order fix
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";

          async function patch(path, transform) {
            const before = await readFile(path, "utf8");
            const after = transform(before);
            if (after === before) throw new Error(`${path}: expected change was not applied`);
            await writeFile(path, after);
          }

          function replaceExact(text, before, after, label) {
            if (!text.includes(before)) throw new Error(`${label}: expected source text not found`);
            return text.replace(before, after);
          }

          await patch("prototype/src/FePracticeSetup.jsx", (text) => replaceExact(
            text,
            `  const filterGroups = [\n    { key: "domains", title: "1. 分野", description: "同じ条件群ではOR、他の条件群とはANDで絞り込みます。", values: selectedDomains, options: domainOptions, onChange: (next) => setGroupSelection("domains", next) },\n    { key: "unitIds", title: "2. 単元", description: "日本語の単元名から複数選択できます。", values: selectedUnitIds, options: unitOptions, onChange: (next) => setGroupSelection("unitIds", next) },\n    { key: "periodIds", title: "3. 開催回・公開区分", values: selectedPeriodIds, options: periodOptions, onChange: (next) => setGroupSelection("periodIds", next) },\n    { key: "reviewScopes", title: "4. 回答・復習状態", description: "未選択の場合は回答履歴で絞り込みません。", values: reviewScopes, options: reviewScopeOptions, onChange: (next) => setGroupSelection("reviewScopes", next) },\n  ];`,
            `  const filterGroups = [\n    { key: "domains", title: "1. 分野", description: "同じ条件群ではOR、他の条件群とはANDで絞り込みます。", values: selectedDomains, options: domainOptions, onChange: (next) => setGroupSelection("domains", next) },\n    { key: "reviewScopes", title: "2. 回答・復習状態", description: "未選択の場合は回答履歴で絞り込みません。", values: reviewScopes, options: reviewScopeOptions, onChange: (next) => setGroupSelection("reviewScopes", next) },\n    { key: "periodIds", title: "3. 開催回・公開区分", values: selectedPeriodIds, options: periodOptions, onChange: (next) => setGroupSelection("periodIds", next) },\n    { key: "unitIds", title: "4. 単元", description: "日本語の単元名から複数選択できます。", values: selectedUnitIds, options: unitOptions, onChange: (next) => setGroupSelection("unitIds", next) },\n  ];`,
            "filterGroups order",
          ));

          await patch("prototype/src/main.jsx", (text) => replaceExact(
            text,
            `    const leftStackHeight = cards[0].getBoundingClientRect().height\n      + rowGap\n      + cards[3].getBoundingClientRect().height;\n    const periodHeight = cards[2].getBoundingClientRect().height;`,
            `    const leftStackHeight = cards[0].getBoundingClientRect().height\n      + rowGap\n      + cards[1].getBoundingClientRect().height;\n    const periodHeight = cards[2].getBoundingClientRect().height;`,
            "layout 2 measurement indices",
          ));

          await patch("prototype/src/fe-filter-variants.css", (text) => {
            text = replaceExact(text,
`html[data-fe-filter-layout="1"] .fe-filter-variant-grid > :nth-child(1) {\n  grid-column: span 4;\n}\n\nhtml[data-fe-filter-layout="1"] .fe-filter-variant-grid > :nth-child(2) {\n  grid-column: span 8;\n}\n\nhtml[data-fe-filter-layout="1"] .fe-filter-variant-grid > :nth-child(3) {\n  grid-column: span 7;\n}\n\nhtml[data-fe-filter-layout="1"] .fe-filter-variant-grid > :nth-child(4) {\n  grid-column: span 5;\n}\n\nhtml[data-fe-filter-layout="2"] .fe-filter-variant-grid {\n  padding-bottom: var(--fe-filter-layout-2-extra-space, 0px);\n}\n\nhtml[data-fe-filter-layout="2"] .fe-filter-variant-grid > :nth-child(1) {\n  grid-column: 1 / span 5;\n  grid-row: 2;\n}\n\nhtml[data-fe-filter-layout="2"] .fe-filter-variant-grid > :nth-child(2) {\n  grid-column: 1 / -1;\n  grid-row: 1;\n}\n\nhtml[data-fe-filter-layout="2"] .fe-filter-variant-grid > :nth-child(3) {\n  position: absolute;\n  inset-block-start: 0;\n  inset-inline: 0;\n  grid-column: 6 / -1;\n  grid-row: 2;\n}\n\nhtml[data-fe-filter-layout="2"] .fe-filter-variant-grid > :nth-child(4) {\n  grid-column: 1 / span 5;\n  grid-row: 3;\n}\n\nhtml[data-fe-filter-layout="3"] .fe-filter-variant-grid > :nth-child(1) {\n  grid-column: 1 / span 4;\n  grid-row: 2;\n}\n\nhtml[data-fe-filter-layout="3"] .fe-filter-variant-grid > :nth-child(2) {\n  grid-column: 5 / -1;\n  grid-row: 2;\n}\n\nhtml[data-fe-filter-layout="3"] .fe-filter-variant-grid > :nth-child(3) {\n  grid-column: 1 / -1;\n  grid-row: 1;\n}\n\nhtml[data-fe-filter-layout="3"] .fe-filter-variant-grid > :nth-child(4) {\n  grid-column: 1 / -1;\n  grid-row: 3;\n}`,
`html[data-fe-filter-layout="1"] .fe-filter-variant-grid > :nth-child(1) {\n  grid-column: span 4;\n}\n\nhtml[data-fe-filter-layout="1"] .fe-filter-variant-grid > :nth-child(2) {\n  grid-column: span 3;\n}\n\nhtml[data-fe-filter-layout="1"] .fe-filter-variant-grid > :nth-child(3) {\n  grid-column: span 5;\n}\n\nhtml[data-fe-filter-layout="1"] .fe-filter-variant-grid > :nth-child(4) {\n  grid-column: 1 / -1;\n}\n\nhtml[data-fe-filter-layout="2"] .fe-filter-variant-grid > :nth-child(1) {\n  grid-column: 1 / span 5;\n  grid-row: 1;\n}\n\nhtml[data-fe-filter-layout="2"] .fe-filter-variant-grid > :nth-child(2) {\n  grid-column: 1 / span 5;\n  grid-row: 2;\n}\n\nhtml[data-fe-filter-layout="2"] .fe-filter-variant-grid > :nth-child(3) {\n  position: absolute;\n  inset-block-start: 0;\n  inset-inline: 0;\n  grid-column: 6 / -1;\n  grid-row: 1 / span 2;\n}\n\nhtml[data-fe-filter-layout="2"] .fe-filter-variant-grid > :nth-child(4) {\n  grid-column: 1 / -1;\n  grid-row: 3;\n  margin-top: var(--fe-filter-layout-2-extra-space, 0px);\n}\n\nhtml[data-fe-filter-layout="3"] .fe-filter-variant-grid > :nth-child(1) {\n  grid-column: 1 / span 4;\n  grid-row: 1;\n}\n\nhtml[data-fe-filter-layout="3"] .fe-filter-variant-grid > :nth-child(2) {\n  grid-column: 5 / -1;\n  grid-row: 1;\n}\n\nhtml[data-fe-filter-layout="3"] .fe-filter-variant-grid > :nth-child(3) {\n  grid-column: 1 / -1;\n  grid-row: 2;\n}\n\nhtml[data-fe-filter-layout="3"] .fe-filter-variant-grid > :nth-child(4) {\n  grid-column: 1 / -1;\n  grid-row: 3;\n}`,
              "desktop grid layouts");

            text = replaceExact(text,
`@media (min-width: 721px) {\n  .fe-filter-variant-grid > :nth-child(2) .fe-check-grid-compact {\n    grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr));\n  }\n}`,
`@media (min-width: 721px) {\n  .fe-filter-variant-grid > :nth-child(4) .fe-check-grid-compact {\n    grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr));\n  }\n}`,
              "unit card width selector");

            text = replaceExact(text,
`  html[data-fe-filter-layout="1"] .fe-filter-variant-grid > :nth-child(1) {\n    grid-column: span 3;\n  }\n\n  html[data-fe-filter-layout="1"] .fe-filter-variant-grid > :nth-child(2) {\n    grid-column: span 5;\n  }\n\n  html[data-fe-filter-layout="1"] .fe-filter-variant-grid > :nth-child(3) {\n    grid-column: span 5;\n  }\n\n  html[data-fe-filter-layout="1"] .fe-filter-variant-grid > :nth-child(4) {\n    grid-column: span 3;\n  }\n\n  html[data-fe-filter-layout="2"] .fe-filter-variant-grid > :nth-child(1) {\n    grid-column: 1 / span 3;\n  }\n\n  html[data-fe-filter-layout="2"] .fe-filter-variant-grid > :nth-child(3) {\n    grid-column: 4 / -1;\n  }\n\n  html[data-fe-filter-layout="2"] .fe-filter-variant-grid > :nth-child(4) {\n    grid-column: 1 / span 3;\n  }\n\n  html[data-fe-filter-layout="3"] .fe-filter-variant-grid > :nth-child(1) {\n    grid-column: 1 / span 3;\n  }\n\n  html[data-fe-filter-layout="3"] .fe-filter-variant-grid > :nth-child(2) {\n    grid-column: 4 / -1;\n  }`,
`  html[data-fe-filter-layout="1"] .fe-filter-variant-grid > :nth-child(1) {\n    grid-column: span 3;\n  }\n\n  html[data-fe-filter-layout="1"] .fe-filter-variant-grid > :nth-child(2) {\n    grid-column: span 2;\n  }\n\n  html[data-fe-filter-layout="1"] .fe-filter-variant-grid > :nth-child(3) {\n    grid-column: span 3;\n  }\n\n  html[data-fe-filter-layout="1"] .fe-filter-variant-grid > :nth-child(4) {\n    grid-column: 1 / -1;\n  }\n\n  html[data-fe-filter-layout="2"] .fe-filter-variant-grid > :nth-child(1) {\n    grid-column: 1 / span 3;\n  }\n\n  html[data-fe-filter-layout="2"] .fe-filter-variant-grid > :nth-child(2) {\n    grid-column: 1 / span 3;\n  }\n\n  html[data-fe-filter-layout="2"] .fe-filter-variant-grid > :nth-child(3) {\n    grid-column: 4 / -1;\n  }\n\n  html[data-fe-filter-layout="2"] .fe-filter-variant-grid > :nth-child(4) {\n    grid-column: 1 / -1;\n  }\n\n  html[data-fe-filter-layout="3"] .fe-filter-variant-grid > :nth-child(1) {\n    grid-column: 1 / span 3;\n  }\n\n  html[data-fe-filter-layout="3"] .fe-filter-variant-grid > :nth-child(2) {\n    grid-column: 4 / -1;\n  }`,
              "tablet grid layouts");
            return text;
          });

          await patch("prototype/tests/fe-filter-layout.test.mjs", (text) => {
            text = replaceExact(text,
              `  assert.match(css, /data-fe-filter-layout=\\"2\\"[^}]*\\.fe-filter-variant-grid\\s*\\{[\\s\\S]*padding-bottom:\\s*var\\(--fe-filter-layout-2-extra-space/);\n  assert.match(css, /data-fe-filter-layout=\\"2\\"[\\s\\S]*:nth-child\\(3\\)\\s*\\{[\\s\\S]*position:\\s*absolute;[\\s\\S]*grid-row:\\s*2;/);`,
              `  assert.match(css, /data-fe-filter-layout=\\"2\\"[\\s\\S]*:nth-child\\(4\\)\\s*\\{[\\s\\S]*margin-top:\\s*var\\(--fe-filter-layout-2-extra-space/);\n  assert.match(css, /data-fe-filter-layout=\\"2\\"[\\s\\S]*:nth-child\\(3\\)\\s*\\{[\\s\\S]*position:\\s*absolute;[\\s\\S]*grid-row:\\s*1 \\/ span 2;/);`,
              "layout 2 CSS assertions");
            text = replaceExact(text,
              `  assert.match(css, /:nth-child\\(2\\) \\.fe-check-grid-compact[\\s\\S]*minmax\\(min\\(100%, 240px\\), 1fr\\)/);`,
              `  assert.match(css, /:nth-child\\(4\\) \\.fe-check-grid-compact[\\s\\S]*minmax\\(min\\(100%, 240px\\), 1fr\\)/);`,
              "unit width assertion");
            text = replaceExact(text,
              `  assert.match(main, /cards\\[0\\][\\s\\S]*cards\\[3\\][\\s\\S]*cards\\[2\\]/);`,
              `  assert.match(main, /cards\\[0\\][\\s\\S]*cards\\[1\\][\\s\\S]*cards\\[2\\]/);`,
              "measurement assertion");
            text = replaceExact(text,
              `  assert.ok(setup.indexOf("<SubjectSelector") < setup.indexOf("fe-filter-variant-grid"));\n  assert.equal((setup.match(/fe-filter-variant-grid/g) || []).length, 1);`,
              `  assert.ok(setup.indexOf("<SubjectSelector") < setup.indexOf("fe-filter-variant-grid"));\n  assert.equal((setup.match(/fe-filter-variant-grid/g) || []).length, 1);\n\n  const expectedGroupMarkers = [\n    'key: "domains", title: "1. 分野"',\n    'key: "reviewScopes", title: "2. 回答・復習状態"',\n    'key: "periodIds", title: "3. 開催回・公開区分"',\n    'key: "unitIds", title: "4. 単元"',\n  ];\n  let previousIndex = -1;\n  for (const marker of expectedGroupMarkers) {\n    const currentIndex = setup.indexOf(marker);\n    assert.ok(currentIndex > previousIndex, \`Filter group order is incorrect at ${marker}\`);\n    previousIndex = currentIndex;\n  }`,
              "explicit source order assertions");
            text = replaceExact(text,
              `  assert.match(audit, /layout2LeftGap/);`,
              `  assert.match(audit, /layout2LeftGap/);\n  assert.match(audit, /keyboardGroupOrder/);`,
              "audit order assertion");
            return text;
          });

          await patch("prototype/scripts/audit-fe-filter-layouts.mjs", (text) => {
            text = replaceExact(text,
              `const expectedMinimums = { sourceCount: 1900, optionCounts: [3, 20, 20, 4] };`,
              `const expectedMinimums = { sourceCount: 1900, optionCounts: [3, 4, 20, 20] };`,
              "audit option order");
            text = replaceExact(text,
              `      layout2LeftGap: cards.length === 4 ? round(cards[3].getBoundingClientRect().top - cards[0].getBoundingClientRect().bottom) : null,`,
              `      layout2LeftGap: cards.length === 4 ? round(cards[1].getBoundingClientRect().top - cards[0].getBoundingClientRect().bottom) : null,`,
              "audit left gap indices");
            text = replaceExact(text,
              `      domOrder: cards.map((card) => card.querySelector('legend')?.textContent?.trim() || ''),\n      unitLabels: cards[1] ? [...cards[1].querySelectorAll('label strong')].map((label) => label.textContent?.trim() || '') : [],\n      unitValues: cards[1] ? [...cards[1].querySelectorAll('label input')].map((input) => input.value || '') : []`,
              `      domOrder: cards.map((card) => card.querySelector('legend')?.textContent?.trim() || ''),\n      keyboardGroupOrder: grid ? [...grid.querySelectorAll('input[type="checkbox"]')].map((input) => input.closest('fieldset')?.querySelector('legend')?.textContent?.trim() || '').filter((legend, index, all) => legend && all.indexOf(legend) === index) : [],\n      unitLabels: cards[3] ? [...cards[3].querySelectorAll('label strong')].map((label) => label.textContent?.trim() || '') : [],\n      unitValues: cards[3] ? [...cards[3].querySelectorAll('label input')].map((input) => input.value || '') : []`,
              "audit semantic indices");
            text = replaceExact(text,
              `    && JSON.stringify(before.domOrder) === JSON.stringify(after.domOrder)\n    && JSON.stringify(before.unitLabels) === JSON.stringify(after.unitLabels)`,
              `    && JSON.stringify(before.domOrder) === JSON.stringify(after.domOrder)\n    && JSON.stringify(before.keyboardGroupOrder) === JSON.stringify(after.keyboardGroupOrder)\n    && JSON.stringify(before.unitLabels) === JSON.stringify(after.unitLabels)`,
              "audit final state comparison");
            text = replaceExact(text,
              `  assert(JSON.stringify(metrics.domOrder) === JSON.stringify(["1. 分野", "2. 単元", "3. 開催回・公開区分", "4. 回答・復習状態"]), \`DOM order changed for variant ${variant}\`);`,
              `  const expectedGroupOrder = ["1. 分野", "2. 回答・復習状態", "3. 開催回・公開区分", "4. 単元"];\n  assert(JSON.stringify(metrics.domOrder) === JSON.stringify(expectedGroupOrder), \`DOM order changed for variant ${variant}\`);\n  assert(JSON.stringify(metrics.keyboardGroupOrder) === JSON.stringify(expectedGroupOrder), \`Keyboard group order changed for variant ${variant}\`);`,
              "audit DOM and keyboard order validation");
            text = replaceExact(text,
              `stable DOM order, keyboard checkbox operation, distinct layouts`,
              `stable DOM and keyboard group order, keyboard checkbox operation, distinct layouts`,
              "audit evidence wording");
            return text;
          });

          await patch("DESIGN.md", (text) => {
            text = replaceExact(text,
`1. 科目Aまたは科目B\n2. 分野\n3. 単元\n4. 開催回または公開区分\n5. 回答状態\n6. 出題数または模擬試験種別`,
`1. 科目Aまたは科目B\n2. 分野\n3. 回答・復習状態\n4. 開催回または公開区分\n5. 単元\n6. 出題数または模擬試験種別`,
              "root design information order");
            text = replaceExact(text,
              `- 受験科目より下にある「分野」「単元」「開催回・公開区分」「回答・復習状態」だけをモジュール不規則型Gridへ配置する`,
              `- 受験科目より下にある「分野」「回答・復習状態」「開催回・公開区分」「単元」だけをモジュール不規則型Gridへ配置する`,
              "root design grid order");
            text = replaceExact(text,
`- パターンBは単元を全幅の先頭カードとし、その下で分野と回答・復習状態を左側へ縦積みし、開催回・公開区分を右側の縦長領域へ配置する`,
`- パターンBは分野と回答・復習状態を左側へ縦積みし、開催回・公開区分を右側の縦長領域へ配置し、その下に単元を全幅カードとして配置する`,
              "root design pattern B");
            text = replaceExact(text,
              `- 375pxでは全パターンをDOM順の1列へ戻す`,
              `- 375pxでは全パターンを「分野 → 回答・復習状態 → 開催回・公開区分 → 単元」のDOM順で1列へ戻す`,
              "root design mobile order");
            return text;
          });

          await patch("prototype/DESIGN.md", (text) => {
            text = replaceExact(text,
              `- Gridの対象は「1. 分野」「2. 単元」「3. 開催回・公開区分」「4. 回答・復習状態」の4ブロックだけとする。`,
              `- Gridの対象は「1. 分野」「2. 回答・復習状態」「3. 開催回・公開区分」「4. 単元」の4ブロックだけとする。`,
              "prototype design grid order");
            text = replaceExact(text,
`- パターンBは単元を全幅の先頭カードとする。\n- その下は分野と回答・復習状態を左側へ縦積みし、開催回・公開区分を右側で2段相当使用する。`,
`- パターンBは分野と回答・復習状態を左側へ縦積みし、開催回・公開区分を右側で2段相当使用する。\n- その下に単元を全幅カードとして配置する。`,
              "prototype design pattern B");
            text = replaceExact(text,
              `- 375pxではDOM順の1列、768pxでは8列基準、1,280px以上では12列基準とする。`,
              `- 375pxでは「分野 → 回答・復習状態 → 開催回・公開区分 → 単元」のDOM順で1列、768pxでは8列基準、1,280px以上では12列基準とする。`,
              "prototype design mobile order");
            return text;
          });
          NODE

      - name: Guard against concurrent target edits
        run: |
          set -euo pipefail
          git fetch origin work
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/work)" ]]; then
            echo "work advanced while applying the fix; refusing to overwrite concurrent changes" >&2
            exit 1
          fi

      - name: Commit scoped fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DESIGN.md prototype/DESIGN.md prototype/src/FePracticeSetup.jsx prototype/src/main.jsx prototype/src/fe-filter-variants.css prototype/tests/fe-filter-layout.test.mjs prototype/scripts/audit-fe-filter-layouts.mjs
          git diff --cached --check
          git diff --cached --quiet && { echo "No scoped changes to commit" >&2; exit 1; }
          git commit -m "fix: reorder FE filter groups"
          git push origin HEAD:work
