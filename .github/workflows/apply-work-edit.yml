name: Temporary repository edit runner

on:
  push:
    branches: [work]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-jll-fe-003-edit
  cancel-in-progress: true

jobs:
  apply-edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record edit run
        shell: bash
        run: |
          set -euo pipefail
          printf '{"runId":%s,"sourceRevision":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > .work-edit-run.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .work-edit-run.json
          git commit -m "chore: record JLL-FE-003 edit run [skip ci]"
          git fetch origin work
          git rebase origin/work
          git push origin HEAD:work
      - name: Apply, verify, and publish prepared edit
        shell: bash
        run: |
          set +e
          : > /tmp/work-edit.log
          python .github/work-edit.py 2>&1 | tee -a /tmp/work-edit.log
          status=${PIPESTATUS[0]}
          if [[ ${status} -eq 0 ]]; then
            (cd prototype && npm ci) 2>&1 | tee -a /tmp/work-edit.log
            status=${PIPESTATUS[0]}
          fi
          if [[ ${status} -eq 0 ]]; then
            (cd prototype && npm run verify:fe) 2>&1 | tee -a /tmp/work-edit.log
            status=${PIPESTATUS[0]}
          fi
          if [[ ${status} -eq 0 ]]; then
            (cd prototype && npm run audit:fe-filter-layouts) 2>&1 | tee -a /tmp/work-edit.log
            status=${PIPESTATUS[0]}
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ ${status} -ne 0 ]]; then
            git reset --hard HEAD
            cp /tmp/work-edit.log .work-edit-failure.log
            git rm -f .github/workflows/apply-work-edit.yml
            git add .work-edit-failure.log
            git commit -m "test: record JLL-FE-003 edit failure [skip ci]"
            git fetch origin work
            git rebase origin/work
            git push origin HEAD:work
            exit ${status}
          fi

          rm -f .github/work-edit.py
          rm -f .github/workflows/apply-work-edit.yml
          rm -f .github/workflows/source-snapshot.yml
          rm -f .source-snapshot-run.json
          rm -f .work-edit-run.json
          rm -f .work-edit-failure.log
          git add -A
          git commit -m "feat: refine FE filter density and unit labels"
          git fetch origin work
          git rebase origin/work
          git push origin HEAD:work
