name: Recover GitHub Pages deployment

on:
  push:
    branches: [pages-recovery]
    paths:
      - .github/workflows/pages-recovery.yml

permissions:
  contents: write
  pages: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale Pages deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          STALE_DEPLOYMENT: 5a5396e32a5159d932a4455f3e0ad632d8b41499
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${REPOSITORY}/pages/deployments/${STALE_DEPLOYMENT}"
          headers=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          read_code="$(curl -sS -L -o /tmp/pages-deployment.json -w '%{http_code}' "${headers[@]}" "${api}")"
          if [[ "${read_code}" == "404" ]]; then
            echo "No stale deployment exists for ${STALE_DEPLOYMENT}."
            exit 0
          fi
          if [[ "${read_code}" != "200" ]]; then
            cat /tmp/pages-deployment.json
            echo "Unable to inspect stale Pages deployment: HTTP ${read_code}" >&2
            exit 1
          fi

          deployment_status="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; const value = JSON.parse(readFileSync("/tmp/pages-deployment.json", "utf8")); process.stdout.write(String(value.status ?? "unknown"));')"
          echo "Current stale deployment status: ${deployment_status}"

          case "${deployment_status}" in
            succeed|success|cancelled|canceled|error|failure)
              echo "Deployment is already terminal."
              exit 0
              ;;
          esac

          cancel_code="$(curl -sS -L -X POST -o /tmp/pages-cancel.json -w '%{http_code}' "${headers[@]}" "${api}/cancel")"
          if [[ "${cancel_code}" != "204" && "${cancel_code}" != "404" ]]; then
            cat /tmp/pages-cancel.json
            echo "Unable to cancel stale Pages deployment: HTTP ${cancel_code}" >&2
            exit 1
          fi

          for attempt in {1..24}; do
            check_code="$(curl -sS -L -o /tmp/pages-check.json -w '%{http_code}' "${headers[@]}" "${api}")"
            if [[ "${check_code}" == "404" ]]; then
              echo "Stale deployment no longer exists."
              exit 0
            fi
            if [[ "${check_code}" != "200" ]]; then
              cat /tmp/pages-check.json
              echo "Unable to confirm cancellation: HTTP ${check_code}" >&2
              exit 1
            fi

            current_status="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; const value = JSON.parse(readFileSync("/tmp/pages-check.json", "utf8")); process.stdout.write(String(value.status ?? "unknown"));')"
            echo "Cancellation check ${attempt}: ${current_status}"
            case "${current_status}" in
              cancelled|canceled|error|failure)
                exit 0
                ;;
            esac
            sleep 5
          done

          echo "Stale deployment did not reach a terminal state." >&2
          exit 1

      - name: Trigger clean Pages retry on work
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RECOVERY_SHA: ${{ github.sha }}
          STALE_DEPLOYMENT: 5a5396e32a5159d932a4455f3e0ad632d8b41499
        run: |
          set -euo pipefail

          path="prototype/qa/pages-recovery-attempt.json"
          api="https://api.github.com/repos/${REPOSITORY}/contents/${path}"
          headers=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          existing_code="$(curl -sS -L -o /tmp/existing.json -w '%{http_code}' "${headers[@]}" "${api}?ref=work")"
          existing_sha=""
          if [[ "${existing_code}" == "200" ]]; then
            existing_sha="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; const value = JSON.parse(readFileSync("/tmp/existing.json", "utf8")); process.stdout.write(String(value.sha ?? ""));')"
          elif [[ "${existing_code}" != "404" ]]; then
            cat /tmp/existing.json
            echo "Unable to inspect recovery marker: HTTP ${existing_code}" >&2
            exit 1
          fi

          requested_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          marker="$(node --input-type=module -e 'const value = { status: "requested", staleDeployment: process.env.STALE_DEPLOYMENT, recoveryRevision: process.env.RECOVERY_SHA, requestedAt: process.env.REQUESTED_AT }; process.stdout.write(`${JSON.stringify(value, null, 2)}\n`);' STALE_DEPLOYMENT="${STALE_DEPLOYMENT}" RECOVERY_SHA="${RECOVERY_SHA}" REQUESTED_AT="${requested_at}")"
          encoded="$(printf '%s' "${marker}" | base64 -w0)"

          CONTENT="${encoded}" EXISTING_SHA="${existing_sha}" node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          const payload = {
            message: "ci: retry Pages after stale deployment cleanup",
            content: process.env.CONTENT,
            branch: "work",
          };
          if (process.env.EXISTING_SHA) payload.sha = process.env.EXISTING_SHA;
          writeFileSync("/tmp/update.json", JSON.stringify(payload));
          NODE

          update_code="$(curl -sS -L -X PUT -o /tmp/update-response.json -w '%{http_code}' "${headers[@]}" -H "Content-Type: application/json" --data-binary @/tmp/update.json "${api}")"
          if [[ "${update_code}" != "200" && "${update_code}" != "201" ]]; then
            cat /tmp/update-response.json
            echo "Unable to trigger clean Pages retry: HTTP ${update_code}" >&2
            exit 1
          fi

          cat /tmp/update-response.json
