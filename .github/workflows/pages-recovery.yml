name: Recover GitHub Pages deployment

on:
  push:
    branches: [pages-recovery]
    paths:
      - .github/workflows/pages-recovery.yml

permissions:
  contents: write
  pages: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale Pages deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          STALE_DEPLOYMENT: 7ac17dd605546149649223e88dd67f22d32c70d3
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}/pages/deployments/${STALE_DEPLOYMENT}"
          headers=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          read_code="$(curl -sS -L -o /tmp/deployment.json -w '%{http_code}' "${headers[@]}" "${api}")"
          if [[ "${read_code}" == "200" ]]; then
            status="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; const value = JSON.parse(readFileSync("/tmp/deployment.json", "utf8")); process.stdout.write(String(value.status ?? "unknown"));')"
            echo "Stale deployment status: ${status}"
            case "${status}" in
              succeed|success|cancelled|canceled|error|failure)
                ;;
              *)
                cancel_code="$(curl -sS -L -X POST -o /tmp/cancel.json -w '%{http_code}' "${headers[@]}" "${api}/cancel")"
                if [[ "${cancel_code}" != "204" && "${cancel_code}" != "404" ]]; then
                  cat /tmp/cancel.json
                  exit 1
                fi
                for attempt in {1..24}; do
                  check_code="$(curl -sS -L -o /tmp/check.json -w '%{http_code}' "${headers[@]}" "${api}")"
                  if [[ "${check_code}" == "404" ]]; then break; fi
                  if [[ "${check_code}" != "200" ]]; then cat /tmp/check.json; exit 1; fi
                  current_status="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; const value = JSON.parse(readFileSync("/tmp/check.json", "utf8")); process.stdout.write(String(value.status ?? "unknown"));')"
                  echo "Cancellation check ${attempt}: ${current_status}"
                  case "${current_status}" in
                    cancelled|canceled|error|failure) break 2 ;;
                  esac
                  sleep 5
                done
                ;;
            esac
          elif [[ "${read_code}" != "404" ]]; then
            cat /tmp/deployment.json
            exit 1
          fi

      - name: Record cancellation completion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RECOVERY_SHA: ${{ github.sha }}
          STALE_DEPLOYMENT: 7ac17dd605546149649223e88dd67f22d32c70d3
        run: |
          set -euo pipefail
          path="prototype/qa/pages-recovery-attempt.json"
          api="https://api.github.com/repos/${REPOSITORY}/contents/${path}"
          headers=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )
          curl -sS -L -o /tmp/existing.json "${headers[@]}" "${api}?ref=work"
          existing_sha="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; const value = JSON.parse(readFileSync("/tmp/existing.json", "utf8")); process.stdout.write(String(value.sha ?? ""));')"
          REQUESTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" STALE_DEPLOYMENT="${STALE_DEPLOYMENT}" RECOVERY_SHA="${RECOVERY_SHA}" node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          const marker = {
            status: "cancelled",
            staleDeployment: process.env.STALE_DEPLOYMENT,
            recoveryRevision: process.env.RECOVERY_SHA,
            completedAt: process.env.REQUESTED_AT,
          };
          const content = Buffer.from(`${JSON.stringify(marker, null, 2)}\n`).toString("base64");
          writeFileSync("/tmp/payload.json", JSON.stringify({
            message: "ci: record Pages cancellation completion",
            content,
            sha: process.env.EXISTING_SHA,
            branch: "work",
          }));
          NODE
          EXISTING_SHA="${existing_sha}" REQUESTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" STALE_DEPLOYMENT="${STALE_DEPLOYMENT}" RECOVERY_SHA="${RECOVERY_SHA}" node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const marker = {
            status: "cancelled",
            staleDeployment: process.env.STALE_DEPLOYMENT,
            recoveryRevision: process.env.RECOVERY_SHA,
            completedAt: process.env.REQUESTED_AT,
          };
          writeFileSync("/tmp/payload.json", JSON.stringify({
            message: "ci: record Pages cancellation completion",
            content: Buffer.from(`${JSON.stringify(marker, null, 2)}\n`).toString("base64"),
            sha: process.env.EXISTING_SHA,
            branch: "work",
          }));
          NODE
          code="$(curl -sS -L -X PUT -o /tmp/response.json -w '%{http_code}' "${headers[@]}" -H "Content-Type: application/json" --data-binary @/tmp/payload.json "${api}")"
          if [[ "${code}" != "200" ]]; then cat /tmp/response.json; exit 1; fi
