name: Cancel accidental Pages deployment

on:
  push:
    branches: [pages-recovery]
    paths:
      - .github/workflows/pages-recovery.yml

permissions:
  contents: write
  pages: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel accidental deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          DEPLOYMENT: dfad4dceb877446fe5d9b447f82e4bdb4f329a2f
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}/pages/deployments/${DEPLOYMENT}"
          headers=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )
          code="$(curl -sS -L -o /tmp/deployment.json -w '%{http_code}' "${headers[@]}" "${api}")"
          status="not_found"
          if [[ "${code}" == "200" ]]; then
            status="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; const data=JSON.parse(readFileSync("/tmp/deployment.json","utf8")); process.stdout.write(String(data.status ?? "unknown"));')"
            case "${status}" in
              succeed|success|cancelled|canceled|error|failure|deployment_succeeded|deployment_cancelled|deployment_canceled|deployment_failed)
                ;;
              *)
                cancel_code="$(curl -sS -L -X POST -o /tmp/cancel.json -w '%{http_code}' "${headers[@]}" "${api}/cancel")"
                [[ "${cancel_code}" == "204" || "${cancel_code}" == "404" ]]
                sleep 5
                check_code="$(curl -sS -L -o /tmp/check.json -w '%{http_code}' "${headers[@]}" "${api}")"
                if [[ "${check_code}" == "200" ]]; then
                  status="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; const data=JSON.parse(readFileSync("/tmp/check.json","utf8")); process.stdout.write(String(data.status ?? "unknown"));')"
                else
                  status="not_found"
                fi
                ;;
            esac
          elif [[ "${code}" != "404" ]]; then
            cat /tmp/deployment.json
            exit 1
          fi
          printf '%s' "${status}" > /tmp/final-status.txt

      - uses: actions/checkout@v4
        with:
          ref: pages-recovery

      - name: Record recovery result
        env:
          DEPLOYMENT: dfad4dceb877446fe5d9b447f82e4bdb4f329a2f
        run: |
          STATUS="$(cat /tmp/final-status.txt)" COMPLETED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" DEPLOYMENT="${DEPLOYMENT}" node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          writeFileSync("pages-recovery-result.json", `${JSON.stringify({
            deployment: process.env.DEPLOYMENT,
            status: process.env.STATUS,
            completedAt: process.env.COMPLETED_AT,
          }, null, 2)}\n`);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages-recovery-result.json
          git diff --cached --quiet && exit 0
          git commit -m "docs: record accidental Pages deployment cleanup [skip ci]"
          git push origin HEAD:pages-recovery

# trigger cleanup
