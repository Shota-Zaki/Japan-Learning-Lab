name: Patch Pages deployment preflight

on:
  push:
    branches: [work]
    paths: [.github/workflows/patch-pages-preflight.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work
      - name: Patch Pages workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/pages.yml')
          text = path.read_text()
          anchor = '    steps:\n      - name: Deploy to GitHub Pages\n'
          if 'Cancel stale Pages deployment before deploy' in text:
              raise SystemExit(0)
          if anchor not in text:
              raise SystemExit('deploy anchor not found')

          expr = '$' + '{{'
          preflight = f'''    steps:
      - name: Cancel stale Pages deployment before deploy
        env:
          GH_TOKEN: {expr} secrets.GITHUB_TOKEN }}}}
          REPOSITORY: {expr} github.repository }}}}
          STALE_DEPLOYMENT: 7ac17dd605546149649223e88dd67f22d32c70d3
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${{REPOSITORY}}/pages/deployments/${{STALE_DEPLOYMENT}}"
          headers=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer ${{GH_TOKEN}}"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )
          code="$(curl -sS -L -o /tmp/deployment.json -w '%{{http_code}}' "${{headers[@]}}" "${{api}}")"
          if [[ "${{code}}" == "200" ]]; then
            status="$(node --input-type=module -e 'import {{ readFileSync }} from "node:fs"; const data=JSON.parse(readFileSync("/tmp/deployment.json","utf8")); process.stdout.write(String(data.status ?? "unknown"));')"
            echo "Stale Pages deployment status: ${{status}}"
            case "${{status}}" in
              succeed|success|cancelled|canceled|error|failure) ;;
              *)
                cancel_code="$(curl -sS -L -X POST -o /tmp/cancel.json -w '%{{http_code}}' "${{headers[@]}}" "${{api}}/cancel")"
                [[ "${{cancel_code}}" == "204" || "${{cancel_code}}" == "404" ]]
                for attempt in {{1..24}}; do
                  check_code="$(curl -sS -L -o /tmp/check.json -w '%{{http_code}}' "${{headers[@]}}" "${{api}}")"
                  if [[ "${{check_code}}" == "404" ]]; then break; fi
                  [[ "${{check_code}}" == "200" ]]
                  current="$(node --input-type=module -e 'import {{ readFileSync }} from "node:fs"; const data=JSON.parse(readFileSync("/tmp/check.json","utf8")); process.stdout.write(String(data.status ?? "unknown"));')"
                  echo "Cancellation check ${{attempt}}: ${{current}}"
                  case "${{current}}" in cancelled|canceled|error|failure) break 2 ;; esac
                  sleep 5
                done
                ;;
            esac
          elif [[ "${{code}}" != "404" ]]; then
            cat /tmp/deployment.json
            exit 1
          fi

      - name: Deploy to GitHub Pages
'''
          path.write_text(text.replace(anchor, preflight))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/pages.yml
          git diff --cached --quiet && exit 0
          git commit -m "ci: add Pages stale deployment preflight [skip ci]"
          git push origin HEAD:work

# trigger
