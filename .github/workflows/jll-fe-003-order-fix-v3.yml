name: Temporary JLL-FE-003 order fix v3

on:
  push:
    branches: [work]
    paths:
      - .github/jll-fe-003-order-fix-v3.trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work
          fetch-depth: 0

      - name: Apply scoped order fix
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"{label}: expected source text not found")
              p.write_text(text.replace(old, new, 1))

          replace(
              "prototype/src/FePracticeSetup.jsx",
              '''  const filterGroups = [
    { key: "domains", title: "1. 分野", description: "同じ条件群ではOR、他の条件群とはANDで絞り込みます。", values: selectedDomains, options: domainOptions, onChange: (next) => setGroupSelection("domains", next) },
    { key: "unitIds", title: "2. 単元", description: "日本語の単元名から複数選択できます。", values: selectedUnitIds, options: unitOptions, onChange: (next) => setGroupSelection("unitIds", next) },
    { key: "periodIds", title: "3. 開催回・公開区分", values: selectedPeriodIds, options: periodOptions, onChange: (next) => setGroupSelection("periodIds", next) },
    { key: "reviewScopes", title: "4. 回答・復習状態", description: "未選択の場合は回答履歴で絞り込みません。", values: reviewScopes, options: reviewScopeOptions, onChange: (next) => setGroupSelection("reviewScopes", next) },
  ];''',
              '''  const filterGroups = [
    { key: "domains", title: "1. 分野", description: "同じ条件群ではOR、他の条件群とはANDで絞り込みます。", values: selectedDomains, options: domainOptions, onChange: (next) => setGroupSelection("domains", next) },
    { key: "reviewScopes", title: "2. 回答・復習状態", description: "未選択の場合は回答履歴で絞り込みません。", values: reviewScopes, options: reviewScopeOptions, onChange: (next) => setGroupSelection("reviewScopes", next) },
    { key: "periodIds", title: "3. 開催回・公開区分", values: selectedPeriodIds, options: periodOptions, onChange: (next) => setGroupSelection("periodIds", next) },
    { key: "unitIds", title: "4. 単元", description: "日本語の単元名から複数選択できます。", values: selectedUnitIds, options: unitOptions, onChange: (next) => setGroupSelection("unitIds", next) },
  ];''',
              "filterGroups",
          )

          replace(
              "prototype/src/main.jsx",
              '''    const leftStackHeight = cards[0].getBoundingClientRect().height
      + rowGap
      + cards[3].getBoundingClientRect().height;
    const periodHeight = cards[2].getBoundingClientRect().height;''',
              '''    const leftStackHeight = cards[0].getBoundingClientRect().height
      + rowGap
      + cards[1].getBoundingClientRect().height;
    const periodHeight = cards[2].getBoundingClientRect().height;''',
              "layout measurement",
          )

          css = "prototype/src/fe-filter-variants.css"
          replace(css, '''html[data-fe-filter-layout="1"] .fe-filter-variant-grid > :nth-child(2) {
  grid-column: span 8;
}''', '''html[data-fe-filter-layout="1"] .fe-filter-variant-grid > :nth-child(2) {
  grid-column: span 3;
}''', "layout1 child2")
          replace(css, '''html[data-fe-filter-layout="1"] .fe-filter-variant-grid > :nth-child(3) {
  grid-column: span 7;
}''', '''html[data-fe-filter-layout="1"] .fe-filter-variant-grid > :nth-child(3) {
  grid-column: span 5;
}''', "layout1 child3")
          replace(css, '''html[data-fe-filter-layout="1"] .fe-filter-variant-grid > :nth-child(4) {
  grid-column: span 5;
}

html[data-fe-filter-layout="2"] .fe-filter-variant-grid {
  padding-bottom: var(--fe-filter-layout-2-extra-space, 0px);
}''', '''html[data-fe-filter-layout="1"] .fe-filter-variant-grid > :nth-child(4) {
  grid-column: 1 / -1;
}''', "layout1 child4 and layout2 padding")
          replace(css, '''html[data-fe-filter-layout="2"] .fe-filter-variant-grid > :nth-child(1) {
  grid-column: 1 / span 5;
  grid-row: 2;
}''', '''html[data-fe-filter-layout="2"] .fe-filter-variant-grid > :nth-child(1) {
  grid-column: 1 / span 5;
  grid-row: 1;
}''', "layout2 child1")
          replace(css, '''html[data-fe-filter-layout="2"] .fe-filter-variant-grid > :nth-child(2) {
  grid-column: 1 / -1;
  grid-row: 1;
}''', '''html[data-fe-filter-layout="2"] .fe-filter-variant-grid > :nth-child(2) {
  grid-column: 1 / span 5;
  grid-row: 2;
}''', "layout2 child2")
          replace(css, '''  grid-column: 6 / -1;
  grid-row: 2;
}

html[data-fe-filter-layout="2"] .fe-filter-variant-grid > :nth-child(4) {
  grid-column: 1 / span 5;
  grid-row: 3;
}''', '''  grid-column: 6 / -1;
  grid-row: 1 / span 2;
}

html[data-fe-filter-layout="2"] .fe-filter-variant-grid > :nth-child(4) {
  grid-column: 1 / -1;
  grid-row: 3;
  margin-top: var(--fe-filter-layout-2-extra-space, 0px);
}''', "layout2 child3-4")
          replace(css, '''html[data-fe-filter-layout="3"] .fe-filter-variant-grid > :nth-child(1) {
  grid-column: 1 / span 4;
  grid-row: 2;
}''', '''html[data-fe-filter-layout="3"] .fe-filter-variant-grid > :nth-child(1) {
  grid-column: 1 / span 4;
  grid-row: 1;
}''', "layout3 child1")
          replace(css, '''html[data-fe-filter-layout="3"] .fe-filter-variant-grid > :nth-child(2) {
  grid-column: 5 / -1;
  grid-row: 2;
}''', '''html[data-fe-filter-layout="3"] .fe-filter-variant-grid > :nth-child(2) {
  grid-column: 5 / -1;
  grid-row: 1;
}''', "layout3 child2")
          replace(css, '''html[data-fe-filter-layout="3"] .fe-filter-variant-grid > :nth-child(3) {
  grid-column: 1 / -1;
  grid-row: 1;
}''', '''html[data-fe-filter-layout="3"] .fe-filter-variant-grid > :nth-child(3) {
  grid-column: 1 / -1;
  grid-row: 2;
}''', "layout3 child3")
          replace(css, '''  .fe-filter-variant-grid > :nth-child(2) .fe-check-grid-compact {''', '''  .fe-filter-variant-grid > :nth-child(4) .fe-check-grid-compact {''', "unit width selector")
          replace(css, '''  html[data-fe-filter-layout="1"] .fe-filter-variant-grid > :nth-child(2) {
    grid-column: span 5;
  }

  html[data-fe-filter-layout="1"] .fe-filter-variant-grid > :nth-child(3) {
    grid-column: span 5;
  }

  html[data-fe-filter-layout="1"] .fe-filter-variant-grid > :nth-child(4) {
    grid-column: span 3;
  }''', '''  html[data-fe-filter-layout="1"] .fe-filter-variant-grid > :nth-child(2) {
    grid-column: span 2;
  }

  html[data-fe-filter-layout="1"] .fe-filter-variant-grid > :nth-child(3) {
    grid-column: span 3;
  }

  html[data-fe-filter-layout="1"] .fe-filter-variant-grid > :nth-child(4) {
    grid-column: 1 / -1;
  }''', "tablet layout1")
          replace(css, '''  html[data-fe-filter-layout="2"] .fe-filter-variant-grid > :nth-child(1) {
    grid-column: 1 / span 3;
  }

  html[data-fe-filter-layout="2"] .fe-filter-variant-grid > :nth-child(3) {''', '''  html[data-fe-filter-layout="2"] .fe-filter-variant-grid > :nth-child(1) {
    grid-column: 1 / span 3;
  }

  html[data-fe-filter-layout="2"] .fe-filter-variant-grid > :nth-child(2) {
    grid-column: 1 / span 3;
  }

  html[data-fe-filter-layout="2"] .fe-filter-variant-grid > :nth-child(3) {''', "tablet layout2 child2")
          replace(css, '''  html[data-fe-filter-layout="2"] .fe-filter-variant-grid > :nth-child(4) {
    grid-column: 1 / span 3;
  }''', '''  html[data-fe-filter-layout="2"] .fe-filter-variant-grid > :nth-child(4) {
    grid-column: 1 / -1;
  }''', "tablet layout2 child4")

          test = "prototype/tests/fe-filter-layout.test.mjs"
          replace(test, '''  assert.match(css, /data-fe-filter-layout=\\"2\\"[^}]*\\.fe-filter-variant-grid\\s*\\{[\\s\\S]*padding-bottom:\\s*var\\(--fe-filter-layout-2-extra-space/);
  assert.match(css, /data-fe-filter-layout=\\"2\\"[\\s\\S]*:nth-child\\(3\\)\\s*\\{[\\s\\S]*position:\\s*absolute;[\\s\\S]*grid-row:\\s*2;/);''', '''  assert.match(css, /data-fe-filter-layout=\\"2\\"[\\s\\S]*:nth-child\\(4\\)\\s*\\{[\\s\\S]*margin-top:\\s*var\\(--fe-filter-layout-2-extra-space/);
  assert.match(css, /data-fe-filter-layout=\\"2\\"[\\s\\S]*:nth-child\\(3\\)\\s*\\{[\\s\\S]*position:\\s*absolute;[\\s\\S]*grid-row:\\s*1 \\/ span 2;/);''', "test layout2")
          replace(test, ''':nth-child\\(2\\) \\.fe-check-grid-compact''', ''':nth-child\\(4\\) \\.fe-check-grid-compact''', "test unit selector")
          replace(test, '''cards\\[0\\][\\s\\S]*cards\\[3\\][\\s\\S]*cards\\[2\\]''', '''cards\\[0\\][\\s\\S]*cards\\[1\\][\\s\\S]*cards\\[2\\]''', "test measurement")
          replace(test, '''  assert.equal((setup.match(/fe-filter-variant-grid/g) || []).length, 1);

  assert.match(audit, /document\\.fonts/);''', '''  assert.equal((setup.match(/fe-filter-variant-grid/g) || []).length, 1);

  const expectedGroupMarkers = [
    'key: "domains", title: "1. 分野"',
    'key: "reviewScopes", title: "2. 回答・復習状態"',
    'key: "periodIds", title: "3. 開催回・公開区分"',
    'key: "unitIds", title: "4. 単元"',
  ];
  let previousIndex = -1;
  for (const marker of expectedGroupMarkers) {
    const currentIndex = setup.indexOf(marker);
    assert.ok(currentIndex > previousIndex, `Filter group order is incorrect at ${marker}`);
    previousIndex = currentIndex;
  }

  assert.match(audit, /document\\.fonts/);''', "explicit group test")
          replace(test, '''  assert.match(audit, /layout2LeftGap/);''', '''  assert.match(audit, /layout2LeftGap/);
  assert.match(audit, /keyboardGroupOrder/);''', "audit marker test")

          audit = "prototype/scripts/audit-fe-filter-layouts.mjs"
          replace(audit, '''const expectedMinimums = { sourceCount: 1900, optionCounts: [3, 20, 20, 4] };''', '''const expectedMinimums = { sourceCount: 1900, optionCounts: [3, 4, 20, 20] };''', "audit counts")
          replace(audit, '''layout2LeftGap: cards.length === 4 ? round(cards[3].getBoundingClientRect().top - cards[0].getBoundingClientRect().bottom) : null,''', '''layout2LeftGap: cards.length === 4 ? round(cards[1].getBoundingClientRect().top - cards[0].getBoundingClientRect().bottom) : null,''', "audit left gap")
          replace(audit, '''      domOrder: cards.map((card) => card.querySelector('legend')?.textContent?.trim() || ''),
      unitLabels: cards[1] ? [...cards[1].querySelectorAll('label strong')].map((label) => label.textContent?.trim() || '') : [],
      unitValues: cards[1] ? [...cards[1].querySelectorAll('label input')].map((input) => input.value || '') : []''', '''      domOrder: cards.map((card) => card.querySelector('legend')?.textContent?.trim() || ''),
      keyboardGroupOrder: grid ? [...grid.querySelectorAll('input[type="checkbox"]')].map((input) => input.closest('fieldset')?.querySelector('legend')?.textContent?.trim() || '').filter((legend, index, all) => legend && all.indexOf(legend) === index) : [],
      unitLabels: cards[3] ? [...cards[3].querySelectorAll('label strong')].map((label) => label.textContent?.trim() || '') : [],
      unitValues: cards[3] ? [...cards[3].querySelectorAll('label input')].map((input) => input.value || '') : []''', "audit semantic cards")
          replace(audit, '''    && JSON.stringify(before.domOrder) === JSON.stringify(after.domOrder)
    && JSON.stringify(before.unitLabels) === JSON.stringify(after.unitLabels)''', '''    && JSON.stringify(before.domOrder) === JSON.stringify(after.domOrder)
    && JSON.stringify(before.keyboardGroupOrder) === JSON.stringify(after.keyboardGroupOrder)
    && JSON.stringify(before.unitLabels) === JSON.stringify(after.unitLabels)''', "audit state match")
          replace(audit, '''  assert(JSON.stringify(metrics.domOrder) === JSON.stringify(["1. 分野", "2. 単元", "3. 開催回・公開区分", "4. 回答・復習状態"]), `DOM order changed for variant ${variant}`);''', '''  const expectedGroupOrder = ["1. 分野", "2. 回答・復習状態", "3. 開催回・公開区分", "4. 単元"];
  assert(JSON.stringify(metrics.domOrder) === JSON.stringify(expectedGroupOrder), `DOM order changed for variant ${variant}`);
  assert(JSON.stringify(metrics.keyboardGroupOrder) === JSON.stringify(expectedGroupOrder), `Keyboard group order changed for variant ${variant}`);''', "audit expected order")
          replace(audit, '''stable DOM order, keyboard checkbox operation''', '''stable DOM and keyboard group order, keyboard checkbox operation''', "audit README")

          replace("DESIGN.md", '''1. 科目Aまたは科目B
2. 分野
3. 単元
4. 開催回または公開区分
5. 回答状態
6. 出題数または模擬試験種別''', '''1. 科目Aまたは科目B
2. 分野
3. 回答・復習状態
4. 開催回または公開区分
5. 単元
6. 出題数または模擬試験種別''', "root design order")
          replace("DESIGN.md", '''- 受験科目より下にある「分野」「単元」「開催回・公開区分」「回答・復習状態」だけをモジュール不規則型Gridへ配置する''', '''- 受験科目より下にある「分野」「回答・復習状態」「開催回・公開区分」「単元」だけをモジュール不規則型Gridへ配置する''', "root grid order")
          replace("DESIGN.md", '''- パターンBは単元を全幅の先頭カードとし、その下で分野と回答・復習状態を左側へ縦積みし、開催回・公開区分を右側の縦長領域へ配置する''', '''- パターンBは分野と回答・復習状態を左側へ縦積みし、開催回・公開区分を右側の縦長領域へ配置し、その下に単元を全幅カードとして配置する''', "root pattern B")
          replace("DESIGN.md", '''- 375pxでは全パターンをDOM順の1列へ戻す''', '''- 375pxでは全パターンを「分野 → 回答・復習状態 → 開催回・公開区分 → 単元」のDOM順で1列へ戻す''', "root mobile order")

          replace("prototype/DESIGN.md", '''- Gridの対象は「1. 分野」「2. 単元」「3. 開催回・公開区分」「4. 回答・復習状態」の4ブロックだけとする。''', '''- Gridの対象は「1. 分野」「2. 回答・復習状態」「3. 開催回・公開区分」「4. 単元」の4ブロックだけとする。''', "prototype design order")
          replace("prototype/DESIGN.md", '''- パターンBは単元を全幅の先頭カードとする。
- その下は分野と回答・復習状態を左側へ縦積みし、開催回・公開区分を右側で2段相当使用する。''', '''- パターンBは分野と回答・復習状態を左側へ縦積みし、開催回・公開区分を右側で2段相当使用する。
- その下に単元を全幅カードとして配置する。''', "prototype pattern B")
          replace("prototype/DESIGN.md", '''- 375pxではDOM順の1列、768pxでは8列基準、1,280px以上では12列基準とする。''', '''- 375pxでは「分野 → 回答・復習状態 → 開催回・公開区分 → 単元」のDOM順で1列、768pxでは8列基準、1,280px以上では12列基準とする。''', "prototype mobile order")
          PY

      - name: Commit and rebase safely
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DESIGN.md prototype/DESIGN.md prototype/src/FePracticeSetup.jsx prototype/src/main.jsx prototype/src/fe-filter-variants.css prototype/tests/fe-filter-layout.test.mjs prototype/scripts/audit-fe-filter-layouts.mjs
          git diff --cached --check
          git commit -m "fix: reorder FE filter groups"
          git pull --rebase origin work
          git push origin HEAD:work
