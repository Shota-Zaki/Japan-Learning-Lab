name: Temporary source snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: |
            AGENTS.md
            PROJECT_CONTEXT.md
            DESIGN.md
            task-list.md
            NEXT_WORK.md
            prototype/DESIGN.md
            prototype/package.json
            prototype/src/FePracticeSetup.jsx
            prototype/src/fe-filter-variants.css
            prototype/src/feFilterLayout.js
            prototype/tests/fe-filter-layout.test.mjs
            prototype/scripts/audit-fe-filter-layouts.mjs
            .github/work-edit.py
          include-hidden-files: true
          retention-days: 1
