name: Audit FE filter layout variants

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - run: npm ci
      - name: Build Pages artifact
        run: npm run build:pages
      - name: Audit three filter layouts
        run: npm run audit:fe-filter-layouts
      - name: Upload browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: fe-filter-layout-evidence
          path: prototype/qa/jll-fe-002-browser
          include-hidden-files: true
          retention-days: 7
