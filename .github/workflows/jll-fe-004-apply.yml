name: Apply JLL-FE-004 implementation

on:
  push:
    branches: [work]
    paths:
      - .github/workflows/jll-fe-004-apply.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work
      - name: Record workflow execution
        run: |
          mkdir -p prototype/qa
          printf '%s\n' "${GITHUB_SHA}" > prototype/qa/jll-fe-004-workflow-start.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototype/qa/jll-fe-004-workflow-start.txt
          git commit -m "chore: record JLL-FE-004 workflow execution [skip ci]"
          git push origin HEAD:work
