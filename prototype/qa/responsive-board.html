<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Japan Learning Lab - Responsive evidence</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #eaf2f5; color: #14252d; font-family: system-ui, sans-serif; }
      main { width: 800px; padding: 26px 16px 60px; }
      h1 { margin: 0 0 8px; font-size: 24px; }
      p { margin: 0 0 24px; color: #61727a; font-size: 13px; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; align-items: start; gap: 14px; }
      figure { margin: 0; padding: 10px; background: #fff; border: 1px solid #c7d7de; }
      img { display: block; width: 100%; height: auto; }
      figcaption { margin-top: 8px; color: #53646c; font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Responsive browser QA</h1>
      <p>Each frame is rendered in its own iframe at the labeled CSS viewport width.</p>
      <div class="grid">
        <figure><img src="responsive-375.png" alt="Japan Learning Lab at 375 pixels" /><figcaption>375px — Japan Learning Lab</figcaption></figure>
        <figure><img src="responsive-768.png" alt="Engineer Learning Lab at 768 pixels" /><figcaption>768px — Engineer Learning Lab</figcaption></figure>
        <figure><img src="responsive-1024.png" alt="Exam dashboard at 1024 pixels" /><figcaption>1024px — 情報技術者試験</figcaption></figure>
        <figure><img src="responsive-1280.png" alt="Java course page at 1280 pixels" /><figcaption>1280px — Java</figcaption></figure>
      </div>
    </main>
  </body>
</html>
