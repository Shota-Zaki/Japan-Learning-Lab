  <g font-family="sans-serif" fill="#111" font-size="24">
    <text x="470" y="560">（注）ループ端の繰返し指定は、</text>
    <text x="535" y="595">変数名：初期値，増分，終値</text>
    <text x="535" y="630">を示す。</text>
  </g>
</svg>
